<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>чо</title>
</head>
<body>
    <h1>Clicks: <div id="count2">0</div></h1>
    <button id="btn">Click!</button>
    <button id="reset">Reset (WARNING!)</button>
    <button id="upgrade">Upgrade!</button>
    <script>
        let count = 0;
        let click = 1;
        document.getElementById("btn").onclick = function() {
            count = count + click;
            document.getElementById("count2").textContent = count;
        };

        document.getElementById("reset").onclick = function() {
            count = 0;
            document.getElementById("count2").textContent = count;
        }

        document.getElementById("upgrade").onclick = function() {
            count = count - 10;
            click = click * 2;
            document.getElementById("count2").textContent = count;
        }
    </script>
</body>
</html>
